<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهم جداً!!!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #000;
      color: #00ff41;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.18; }

    #loading {
      position: fixed; inset: 0; background: #000; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #loading .bar-wrap {
      width: 260px; height: 6px; background: #111;
      border: 1px solid #00ff41; border-radius: 4px; overflow: hidden;
    }
    #loading .bar { height: 100%; width: 0%; background: #00ff41; box-shadow: 0 0 10px #00ff41; }
    #loading p { font-family: 'Share Tech Mono', monospace; color: #00ff41; font-size: 13px; letter-spacing: 2px; }
    .blink { animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #main {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 30px 20px;
      position: relative; z-index: 2;
    }
    .skull {
      font-size: clamp(60px, 18vw, 110px);
      animation: pulse 1s ease-in-out infinite alternate;
      display: block; margin-bottom: 14px;
      filter: drop-shadow(0 0 20px #00ff41);
    }
    @keyframes pulse {
      from { transform: scale(1); filter: drop-shadow(0 0 10px #00ff41); }
      to   { transform: scale(1.08); filter: drop-shadow(0 0 30px #00ff41); }
    }
    .laugh {
      font-size: clamp(42px, 14vw, 100px);
      font-weight: 900; color: #00ff41;
      text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
      animation: glitch 3s infinite; line-height: 1.1; margin-bottom: 16px;
    }
    @keyframes glitch {
      0%,95%,100% { text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41; transform: translate(0); }
      96% { text-shadow: -3px 0 #ff0000, 3px 0 #00ffff; transform: translate(-2px,1px); }
      97% { text-shadow: 3px 0 #ff0000, -3px 0 #00ffff; transform: translate(2px,-1px); }
      98% { text-shadow: 0 0 20px #00ff41; transform: translate(0); }
    }
    .hack-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(16px, 5vw, 28px);
      color: #00ff41; border: 1px solid #00ff41;
      padding: 14px 28px; border-radius: 4px;
      box-shadow: 0 0 20px rgba(0,255,65,0.3), inset 0 0 20px rgba(0,255,65,0.05);
      animation: fadeInUp 0.6s 0.2s both; letter-spacing: 1px;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .scanline {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scanline"></div>

  <div id="loading">
    <p id="load-msg">INITIALIZING...</p>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <p class="blink">▌</p>
  </div>

  <div id="main">
    <span class="skull">💀</span>
    <div class="laugh">هاهاهاها</div>
    <div class="hack-text">تم سرقتك بنجاح 😈</div>
  </div>

  <script>
    // Matrix rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const cols = Math.floor(canvas.width / 16);
    const drops = Array(cols).fill(1);
    const chars = 'アイウエオカキクケコ0123456789ABCDEF@#$%';
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px monospace';
      drops.forEach((y, i) => {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
        if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 50);

    // Fake loading
    const messages = ['SCANNING...', 'BYPASSING...', 'ACCESSING...', 'HACKING...', 'DONE ✓'];
    let prog = 0;
    const bar = document.getElementById('bar');
    const msg = document.getElementById('load-msg');
    const iv = setInterval(() => {
      prog += Math.random() * 18 + 5;
      if (prog >= 100) { prog = 100; clearInterval(iv); showMain(); }
      bar.style.width = prog + '%';
      msg.textContent = messages[Math.min(Math.floor(prog / 25), 4)];
    }, 220);

    function showMain() {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'flex';
      }, 400);
    }
  </script>
</body>
</html>
