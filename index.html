<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.15; }

    #loading {
      position: fixed; inset: 0; background: #000; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #loading .bar-wrap {
      width: 260px; height: 6px; background: #111;
      border: 1px solid #00ff41; border-radius: 4px; overflow: hidden;
    }
    #loading .bar { height: 100%; width: 0%; background: #00ff41; box-shadow: 0 0 10px #00ff41; }
    #loading p { font-family: 'Share Tech Mono', monospace; color: #00ff41; font-size: 13px; letter-spacing: 2px; }
    .blink { animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #main {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 40px 24px;
      position: relative; z-index: 2; gap: 28px;
    }

    .ar-text {
      font-family: 'Cairo', sans-serif;
      font-size: clamp(28px, 9vw, 64px);
      font-weight: 900;
      color: #00ff41;
      text-shadow: 0 0 20px #00ff41, 0 0 40px rgba(0,255,65,0.4);
      animation: glitch 4s infinite, fadeIn 0.8s both;
      line-height: 1.2;
    }

    .en-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(14px, 4vw, 28px);
      color: #00ff41;
      opacity: 0.75;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-top: 1px solid rgba(0,255,65,0.3);
      padding-top: 24px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.8s 0.4s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitch {
      0%,94%,100% { text-shadow: 0 0 20px #00ff41, 0 0 40px rgba(0,255,65,0.4); transform: translate(0); }
      95% { text-shadow: -3px 0 #ff0000, 3px 0 #00ffff; transform: translate(-2px, 1px); }
      96% { text-shadow: 3px 0 #ff0000, -3px 0 #00ffff; transform: translate(2px, -1px); }
      97% { text-shadow: 0 0 20px #00ff41; transform: translate(0); }
    }

    .scanline {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scanline"></div>

  <div id="loading">
    <p id="load-msg">INITIALIZING...</p>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <p class="blink">▌</p>
  </div>

  <div id="main">
    <div class="ar-text">تم سحب البيانات</div>
    <div class="en-text">Data Has Been Extracted</div>
  </div>

  <script>
    // Matrix rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const cols = Math.floor(canvas.width / 16);
    const drops = Array(cols).fill(1);
    const chars = 'アイウエオカキクケコ0123456789ABCDEF@#$%';
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px monospace';
      drops.forEach((y, i) => {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
        if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 50);

    // Fake loading
    const messages = ['SCANNING...', 'BYPASSING...', 'ACCESSING...', 'EXTRACTING...', 'DONE'];
    let prog = 0;
    const bar = document.getElementById('bar');
    const msg = document.getElementById('load-msg');
    const iv = setInterval(() => {
      prog += Math.random() * 18 + 5;
      if (prog >= 100) { prog = 100; clearInterval(iv); showMain(); }
      bar.style.width = prog + '%';
      msg.textContent = messages[Math.min(Math.floor(prog / 25), 4)];
    }, 220);

    function showMain() {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'flex';
      }, 400);
    }
  </script>
</body>
</html>
